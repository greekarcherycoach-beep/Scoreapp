name: Build APK

on:
  workflow_dispatch:      # χειροκίνητη εκτέλεση από την καρτέλα Actions
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Εγκατάσταση εξαρτήσεων
        run: npm install

      - name: Δημιουργία έργου Android
        run: npx cap add android

      - name: Ρυθμίσεις Android (δικαιώματα, εικονίδιο)
        run: node scripts/patch-android.js

      - name: Συγχρονισμός web αρχείων
        run: npx cap sync android

      - name: Κατασκευή APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ανέβασμα APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcheryLab-Score-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
